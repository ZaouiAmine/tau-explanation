<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Understanding Tau — Redirecting...</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect
    // This redirects all 404s to index.html so the React app can handle routing
    var pathSegmentsToKeep = 1; // Set to 0 for apex domain, 1 for username.github.io/repo
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
